# Consola Angular — servidor estático con fallback SPA y proxy al back-office.
server {
    listen 4301;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # opcional: enrutar el API del back-office (mismo origen) para el api-sdk
    location /api/ {
        proxy_pass http://api:3151/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # fallback SPA del enrutador Angular
    location / {
        try_files $uri $uri/ /index.html;
    }
}
