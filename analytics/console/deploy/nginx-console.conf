# Consola Angular — servidor estático con fallback SPA y proxy al back-office.
server {
    listen 4301;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sin caché del HTML: cada recarga toma el build nuevo (los assets van hasheados).
    add_header Cache-Control "no-store, must-revalidate" always;

    # opcional: enrutar el API del back-office (mismo origen) para el api-sdk
    location /api/ {
        proxy_pass http://api:3151/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Exportaciones/consultas largas: sin buffering y con timeouts amplios.
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Seeder (SOLO dev): proxy al servicio `seed`. Con variable + resolver para NO
    # fallar al arrancar cuando el servicio no existe (p.ej. en producción).
    location /seed/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $seed_upstream seed:3161;
        rewrite ^/seed/(.*)$ /$1 break;
        proxy_pass http://$seed_upstream;
        proxy_set_header Host $host;
        # Cargas masivas (muestra de 1M): sin buffering y con timeouts amplios, para
        # no cortar la respuesta con el default de 60 s.
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # fallback SPA del enrutador Angular (sin $uri/ para no forzar el 301 a /ruta/)
    location / {
        try_files $uri /index.html;
    }

    # HTML siempre sin caché
    location ~* \.html$ {
        add_header Cache-Control "no-store, must-revalidate" always;
    }
}
