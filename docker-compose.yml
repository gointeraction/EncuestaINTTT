services:
  postgres:
    image: postgres:16-alpine
    container_name: intt_postgres
    restart: always
    environment:
      POSTGRES_USER: intt_user
      POSTGRES_PASSWORD: intt_secure_password_2026
      POSTGRES_DB: intt_encuesta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
        -c shared_buffers=512MB
        -c max_connections=200
        -c effective_cache_size=1536MB
        -c work_mem=16MB
        -c random_page_cost=1.1

  redis:
    image: redis:7-alpine
    container_name: intt_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
