# =============================================================================
# EncuestaINTTT — Nginx perimetral (Zona 1 DMZ)
# Proxy inverso + gzip + rate-limit del submit + Zero-Trust para el dashboard.
# El tráfico interno del compose va a `app:3001`.
# =============================================================================

# Rate-limit global por IP para el envío de respuestas (10/min).
limit_req_zone $binary_remote_addr zone=survey_submit_limit:10m rate=10r/m;

upstream encuesta_app {
    server app:3001;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    # --- Compresión ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # --- Cabeceras comunes de proxy ---
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    # --- Rate-limit del envío ciudadano ---
    location = /api/survey/submit {
        limit_req zone=survey_submit_limit burst=5 nodelay;
        proxy_pass http://encuesta_app;
    }

    # --- ZERO-TRUST: administración SÓLO desde Intranet / VPN INTT ---
    # Rutas admin/stats/participants/seed + panel /admin.
    location ~ ^/(api/admin|api/survey/stats|api/survey/participants|api/survey/seed|admin) {
        allow 127.0.0.1;
        allow 10.0.0.0/8;       # Red corporativa INTT
        allow 172.16.0.0/12;    # VPN institucional
        allow 192.168.0.0/16;   # LAN oficinas
        # EXTRA_ADMIN_IP: añade aquí `allow <ip>;` si necesitas una pública fija.
        deny all;               # 403 Forbidden para Internet público

        proxy_pass http://encuesta_app;
    }

    # --- Proxy general (portal ciudadano, dashboard con auth de app, estáticos) ---
    location / {
        proxy_pass http://encuesta_app;
    }

    # --- Healthcheck del propio proxy ---
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
