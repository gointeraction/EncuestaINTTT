# =============================================================================
# EncuestaINTTT — despliegue autocontenido en UN solo compose.
# DOS entornos por configuración (ver .akuri/00-manifest/environments.md):
#   dev :  docker compose --env-file .env.development up -d --build
#   prod:  docker compose --env-file .env.production  up -d --build
# Diferencian base de datos (POSTGRES_DB), ruta de datos (APP_ENV) y proyecto.
# Servicios: db · cache · migrate · app (captura) · api (back-office) · admin (consola) · proxy
#            (+ `seed`, perfil opcional: seeder de datos simulados, SOLO dev).
# PERÍMETRO: `proxy` (vision-cero, la encuesta) es la ÚNICA entrada pública (red
#            `intt-edge`); el back-office analítico (`api` + `admin`) es PRIVADO y
#            vive sólo en `intt-internal`, sin unirse al borde.
# Los datos viven COLOCALIZADOS por defecto en el repo, bajo ./.data/<entorno>/ (gitignored).
# `PG_DATA_DIR` permite cambiarlo: en dev apunta a ./db/postgres (inspeccionable); en
# producción lo fija DevOps (p.ej. ./.data/production/postgres o una ruta absoluta).
# =============================================================================
name: "${COMPOSE_PROJECT_NAME:-encuesta-intt}"

x-database-url: &database_url
  DATABASE_URL: postgresql://${POSTGRES_USER:-intt_user}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en .env}@db:5451/${POSTGRES_DB:-intt_encuesta}?schema=public

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-intt_encuesta}
    # PGDATA vive con el repo (bind mount). Ruta por `PG_DATA_DIR`:
    #   dev  → ./db/postgres (inspeccionable)  ·  prod → ./.data/production/postgres (o la que fije DevOps)
    volumes:
      - "${PG_DATA_DIR:-./.data/${APP_ENV:-development}/postgres}:/var/lib/postgresql/data"
      - ./db/init:/docker-entrypoint-initdb.d:ro
    command: >
      postgres
        -c port=5451
        -c shared_buffers=512MB
        -c max_connections=200
        -c effective_cache_size=1536MB
        -c work_mem=16MB
        -c random_page_cost=1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intt_user} -d ${POSTGRES_DB:-intt_encuesta} -p 5451"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [intt-internal]

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - "./.data/${APP_ENV:-development}/redis:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [intt-internal]

  # One-shot: sincroniza el esquema Prisma y termina (app espera su éxito).
  migrate:
    build:
      context: ./vision-cero
      target: migrator
    env_file: [".env.${APP_ENV:-development}"]
    environment:
      <<: *database_url
      DB_SYNC: ${DB_SYNC:-push}          # push | deploy
      IMPORT_BACKUP: ${IMPORT_BACKUP:-0} # 1 = importa db/sqlite_backup.json
      SUMMARIZE: ${SUMMARIZE:-0}         # 1 = precalcula el dashboard
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?defina ANALYTICS_DB_PASSWORD en .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [intt-internal]

  app:
    build:
      context: ./vision-cero
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://encuesta.intt.gob.ve}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    env_file: [".env.${APP_ENV:-development}"]
    environment:
      <<: *database_url
      REDIS_URL: redis://cache:6379
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: 0.0.0.0
      # Secreto interno para aceptar envíos con canal `seed` (los reenvía el seeder).
      SEED_SUBMIT_SECRET: ${SEED_SUBMIT_SECRET:-dev-seed-secret}
    volumes:
      # Persistencia del almacén local de respaldo (resiliencia).
      - ./vision-cero/db:/app/db
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [intt-internal]

  proxy:
    image: nginx:1.24-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./vision-cero/deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/api"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [intt-internal, intt-edge]

  # Back-office analítico (NestJS): analítica, reportería y acceso restringido.
  api:
    build:
      context: analytics/api
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://intt_analytics:${ANALYTICS_DB_PASSWORD:?defina ANALYTICS_DB_PASSWORD en .env}@db:5451/${POSTGRES_DB:-intt_encuesta}?schema=analytics
      REDIS_URL: redis://cache:6379
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-development}
      PORT: "3151"
      STAFF_ADMIN_EMAIL: ${STAFF_ADMIN_EMAIL:-admin@intt.gob.ve}
      STAFF_ADMIN_PASSWORD: ${STAFF_ADMIN_PASSWORD:-VisionCero2026!}
      # Turnstile del login de la consola (misma clave que la captura; vacío/1x = sin exigir).
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3151/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [intt-internal]

  # Consola de análisis (Angular, estáticos servidos por Nginx).
  # PRIVADA (intranet): NO se une a `intt-edge` y su puerto se publica sólo en la
  # interfaz interna `ADMIN_BIND` (por defecto loopback), nunca en 0.0.0.0.
  admin:
    build:
      context: analytics/console
    restart: unless-stopped
    ports:
      - "${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-4301}:4301"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:4301/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [intt-internal]

  # Seeder de datos simulados (NestJS standalone) — SOLO entorno development.
  # NO arranca con `up` (perfil `seed`); se invoca a demanda:
  #   docker compose run --rm seed seed --profile large --seed 42
  seed:
    profiles: [seed]
    build:
      context: analytics/seed
    env_file: [".env.${APP_ENV:-development}"]
    # Escribe los CSV en el host con el UID/GID del usuario (no root).
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      APP_ENV: ${APP_ENV:-development}
      SEED_ALLOW: ${SEED_ALLOW:-0}
      PORT: "3161"
      DATABASE_URL: postgresql://${POSTGRES_USER:-intt_user}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en .env}@db:5451/${POSTGRES_DB:-intt_encuesta}?schema=public
      API_BASE_URL: http://api:3151
      # La captura real (para reenviar envíos con canal `seed`).
      CAPTURE_BASE_URL: http://app:3001
      SEED_SUBMIT_SECRET: ${SEED_SUBMIT_SECRET:-dev-seed-secret}
    volumes:
      # Los CSV generados quedan en el host (inspección / recarga).
      - ./analytics/seed/data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks: [intt-internal]
    restart: unless-stopped

networks:
  intt-internal: {}
  intt-edge: {}
